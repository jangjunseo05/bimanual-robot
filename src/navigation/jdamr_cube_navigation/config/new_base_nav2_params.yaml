# New-base physical navigation profile.
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 3000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    default_nav_to_pose_bt_xml: ''
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    - position_goal_checker
    controller_plugins:
    - FollowPath
    - MPPI
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.10
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    position_goal_checker:
      stateful: true
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.15
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.12
      lookahead_dist: 0.45
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.3
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      # Observation/staging goals keep transit speed; Parking pins final braking.
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.2
      # Off (operator request 2026-10-01, test props): the 1.5 s projection on 5 cm
      # cells stopped a turn with about 10 cm real clearance at the water box. The
      # Collision Monitor StopZone below still stops at the padded footprint.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: false
      # Physical footprint collision monitoring remains in the command path.
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.075
      cost_scaling_dist: 0.2
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      allow_reversing: false
      # Rotate in place above 45 deg (Nav2 default). The base turns about a point
      # 0.085 m behind its front and 0.295 m ahead of its rear, so a forward arc swings
      # the tail; a box escape leaves room only for an in-place turn (2026-10-01 104).
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
    # Transit and dock staging controller since 2026-10-05 (navigate_through_poses_transit,
    # navigate_to_pose_staging; --rpp-transit keeps RPP for the A/B). RPP does not look at
    # the footprint on a curve (collision detection off, operator 2026-10-01): its
    # left arc swung the right rear corner into a desk leg (2026-10-02 11:09). MPPI
    # scores sampled (v, w) rollouts with the footprint (CostCritic
    # consider_footprint). 1000 x 40 held 10.3 Hz on the idle Pi but 5.8-9.9 Hz while
    # driving (2026-10-02 13:47), so 500 samples x 30 steps of 0.1 s. No reverse in
    # transit (13:47: 66 reverse commands, back and forth) and turns at the
    # smoother's 0.3 rad/s cap, inside the rotation StopZone sweep.
    MPPI:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      time_steps: 30
      model_dt: 0.1
      batch_size: 500
      iteration_count: 1
      vx_std: 0.05
      vy_std: 0.0
      wz_std: 0.3
      vx_max: 0.12
      # Forward only again. With -0.08 (operator 2026-10-06 11:21) MPPI turned 50 deg in
      # the dock and backed 50 s into the water box (14:11); the stop past the observation
      # pose that reverse was for (11:07) is gone now that MPPI ends at the pre-point and
      # RPP takes the leg to the observation pose (final_leg_behavior_tree).
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.3
      ax_max: 0.5
      ax_min: -0.5
      ay_max: 0.0
      az_max: 1.5
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.2
      transform_tolerance: 0.5
      enforce_path_inversion: false
      visualize: false
      regenerate_noises: false
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 4
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        # Heading only in the last 0.1 m: from 0.5 m it turned the base onto the goal
        # heading first and then could not close a 0.2 m sideways offset inside a
        # 3 s (0.36 m) horizon (2026-10-06 S1, S2: 105 at 0.15-0.21 m). At 0.1 the
        # same 0.17 m offset ended 2 cm off (S3).
        threshold_to_consider: 0.1
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        # The furthest path point the 3 s rollouts reach at 0.12 m/s is about 7
        # (0.36 m at 5 cm spacing); at Nav2's 20 this critic never scored, MPPI cut
        # corners and passed a waypoint 0.31 m away (2026-10-06 10:11).
        offset_from_furthest: 5
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      transform_tolerance: 0.7
      # Measured body plus 5 mm (jdamr_cube_description new_base_geometry.yaml; 2 cm
      # until 2026-10-02: a 0.64 m gap left 5 cm for the centre, operator: "lower it,
      # touching is fine, parking has to reach 1 cm"): the
      # frame is 0.45 m wide (+-0.225) over its 0.34 m length; only the 0.54 m wheels
      # (+-0.27, radius 0.033 m around the axle) are wider. A full-length wheel-width
      # rectangle held a desk leg 6.5 cm beside the frame inside every StopZone
      # direction and the base could not move at all (2026-10-02 10:06).
      footprint: '[[0.07, 0.23], [0.038, 0.23], [0.038, 0.275], [-0.038, 0.275], [-0.038, 0.23], [-0.172, 0.23], [-0.172, 0.275], [-0.248, 0.275], [-0.248, 0.23], [-0.28, 0.23], [-0.28, -0.23], [-0.248, -0.23], [-0.248, -0.275], [-0.172, -0.275], [-0.172, -0.23], [-0.038, -0.23], [-0.038, -0.275], [0.038, -0.275], [0.038, -0.23], [0.07, -0.23]]'
      # The polygon already includes 5 mm beyond the measured body.
      footprint_padding: 0.0
      plugins:
      - obstacle_layer
      - inflation_layer
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: false
        filter_info_topic: /keepout_costmap_filter_info
        transform_tolerance: 0.7
        override_lethal_cost: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Steep decay: only cells next to an obstacle are expensive. At 3.0 a cell
        # 18 cm from one still cost ~190 and MPPI crept at 1 deg/s between objects
        # 18 cm away (2026-10-02 18:22).
        cost_scaling_factor: 10.0
        # >= the circumscribed radius of the four-wheel footprint, so MPPI's
        # footprint cost check can use the inflated costs (RPP and the Collision
        # Monitor do not read this costmap).
        inflation_radius: 0.40
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: false
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.7
      footprint: '[[0.07, 0.23], [0.038, 0.23], [0.038, 0.275], [-0.038, 0.275], [-0.038, 0.23], [-0.172, 0.23], [-0.172, 0.275], [-0.248, 0.275], [-0.248, 0.23], [-0.28, 0.23], [-0.28, -0.23], [-0.248, -0.23], [-0.248, -0.275], [-0.172, -0.275], [-0.172, -0.23], [-0.038, -0.23], [-0.038, -0.275], [0.038, -0.275], [0.038, -0.23], [0.07, -0.23]]'
      # Match the explicitly padded local footprint; do not pad it twice.
      footprint_padding: 0.0
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      filters:
      - keepout_filter
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: false
        filter_info_topic: /keepout_costmap_filter_info
        transform_tolerance: 0.7
        override_lethal_cost: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # >= the circumscribed radius (0.362 m to the rear corners since the 5 mm
        # footprint; 0.414 m before) so Lattice checks the footprint cheaply; NavFn
        # paths were identical at 0.45 on this map (2026-09-30 bench).
        inflation_radius: 0.45
      always_send_full_costmap: false
map_server:
  ros__parameters:
    yaml_filename: ''
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    - Lattice
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: false
    # Transit and dock staging since 2026-10-05, NavFn when it finds nothing. Live
    # plans on the Pi (2026-10-01) looped 2-5x on through-pose transits with live
    # obstacles in the costmap; on the map alone with the executor's waypoint headings
    # (each faces the next waypoint) the same legs ran 1.00-1.02x (PC probe 2026-10-05,
    # $HOME/jdamr_data/analysis_20261005/lattice_probe). Headings facing the arrival
    # direction or a single final goal still loop (1.77-2.40x).
    Lattice:
      plugin: nav2_smac_planner::SmacPlannerLattice
      allow_unknown: false
      tolerance: 0.10
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # Successful plans took at most 0.543 s on the Pi (2026-10-01); a failed search
      # (no way through between obstacles) runs to this limit before NavFn gets the
      # goal, every replan, so it is capped at 1 s (2026-10-05, was 2 s).
      max_planning_time: 1.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 0.5
      retrospective_penalty: 0.015
      lattice_filepath: /opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      allow_reverse_expansion: false
      smooth_path: true
      debug_visualizations: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.7
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    # 2026-09-30 operator request: transit +50 % (0.08 -> 0.12 m/s); parking
    # keeps its own 0.04 m/s contract. Rotation stays 0.3 rad/s.
    max_velocity:
    - 0.12
    - 0.0
    - 0.3
    min_velocity:
    - 0.0
    - 0.0
    - -0.3
    max_accel:
    - 0.35
    - 0.0
    - 1.5
    max_decel:
    - -0.5
    - 0.0
    - -1.5
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    # The G4 normally publishes near 10 Hz. One second tolerates bounded Pi
    # scheduling jitter while preventing motion on materially stale scans.
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - StopZone
    - SlowdownZone
    - FootprintApproach
    StopZone:
      type: velocity_polygon
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: stop_zone
      enabled: true
      holonomic: false
      # First match wins (checked with a local monitor, 2026-10-02): the
      # zero-turn polygons come before the general translation ones.
      velocity_polygons:
      - rotation
      - rotation_clockwise
      - translation_forward_straight
      - translation_backward_straight
      - translation_forward
      - translation_backward
      - stopped
      rotation:
        # The padded footprint swept 6 deg in the turn direction
        # (evaluation/rotation_sweep_polygon.py): a leg beside the body that a
        # turn would sweep into still stops it. 6 deg covers the stop from the
        # smoother's 0.3 rad/s cap: 0.1 s scan (1.7 deg) + 1.5 rad/s^2 deceleration
        # (1.7 deg) ~ 3.4 deg; the base's own stop at 0.3 rad/s is not measured
        # (2026-10-01 Spin: 1.3 deg after the stop command at 0.2 rad/s). The
        # 0.43 m circle it replaces stopped turns that touched nothing
        # (2026-10-02 13:48, MPPI; operator 2026-10-02: relax it).
        points: '[[-0.3048, 0.2022], [-0.283, 0.233], [-0.2769, 0.233], [-0.2787, 0.2502], [-0.251, 0.278], [-0.169, 0.278], [-0.169, 0.233], [-0.0657, 0.233], [-0.0698, 0.2722], [-0.041, 0.278], [0.0117, 0.2808], [0.041, 0.278], [0.041, 0.2386], [0.073, 0.233], [0.073, 0.0038], [0.097, -0.2241], [0.0657, -0.233], [0.0698, -0.2722], [0.041, -0.278], [-0.0117, -0.2808], [-0.041, -0.278], [-0.041, -0.2386], [-0.1437, -0.2494], [-0.139, -0.2941], [-0.2206, -0.3027], [-0.251, -0.278], [-0.251, -0.2607], [-0.2571, -0.2613], [-0.283, -0.233], [-0.283, -0.0148]]'
        linear_min: -0.005
        linear_max: 0.005
        theta_min: 0.005
        theta_max: 1.0
      rotation_clockwise:
        # Keep zero angular velocity out of both rotation ranges. Previously
        # (0, 0) selected the 0.43 m circumscribed circle instead of the
        # stopped rectangle and could latch StopZone after the controller
        # had already stopped. Mirror of the counterclockwise sweep.
        points: '[[-0.283, 0.0148], [-0.283, 0.233], [-0.2571, 0.2613], [-0.251, 0.2607], [-0.251, 0.278], [-0.2206, 0.3027], [-0.139, 0.2941], [-0.1437, 0.2494], [-0.041, 0.2386], [-0.041, 0.278], [-0.0117, 0.2808], [0.041, 0.278], [0.0698, 0.2722], [0.0657, 0.233], [0.097, 0.2241], [0.073, -0.0038], [0.073, -0.233], [0.041, -0.2386], [0.041, -0.278], [0.0117, -0.2808], [-0.041, -0.278], [-0.0698, -0.2722], [-0.0657, -0.233], [-0.169, -0.233], [-0.169, -0.278], [-0.251, -0.278], [-0.2787, -0.2502], [-0.2769, -0.233], [-0.283, -0.233], [-0.3048, -0.2022]]'
        linear_min: -0.005
        linear_max: 0.005
        theta_min: -1.0
        theta_max: -0.005
      translation_forward_straight:
        # Zero turn rate: only the half ahead of the axle can meet anything new.
        # A return inside the padded footprint behind the axle held every other
        # polygon, so the base could not drive away from it (2026-10-02 11:09:
        # a desk leg 1.3-2.0 cm beside the frame at the right rear corner).
        points: '[[0.465, 0.23], [0.038, 0.23], [0.038, 0.275], [0.0, 0.275], [0.0, -0.275], [0.038, -0.275], [0.038, -0.23], [0.465, -0.23]]'
        linear_min: 0.005
        linear_max: 0.2
        theta_min: -0.005
        theta_max: 0.005
      translation_backward_straight:
        # Zero turn rate in reverse: the half behind the axle, rear edge as below.
        points: '[[0.0, 0.275], [-0.038, 0.275], [-0.038, 0.23], [-0.172, 0.23], [-0.172, 0.275], [-0.248, 0.275], [-0.248, 0.23], [-0.28, 0.23], [-0.28, -0.23], [-0.248, -0.23], [-0.248, -0.275], [-0.172, -0.275], [-0.172, -0.23], [-0.038, -0.23], [-0.038, -0.275], [0.0, -0.275]]'
        linear_min: -0.2
        linear_max: -0.005
        theta_min: -0.005
        theta_max: 0.005
      translation_forward:
        # Straight forward motion does not close lateral clearance. Keep the
        # requested 400 mm from the physical front edge, but do not add another lateral
        # band outside the already padded costmap footprint. FootprintApproach
        # still projects the full swept footprint whenever the path turns.
        points: '[[0.465, 0.23], [0.038, 0.23], [0.038, 0.275], [-0.038, 0.275], [-0.038, 0.23], [-0.172, 0.23], [-0.172, 0.275], [-0.248, 0.275], [-0.248, 0.23], [-0.28, 0.23], [-0.28, -0.23], [-0.248, -0.23], [-0.248, -0.275], [-0.172, -0.275], [-0.172, -0.23], [-0.038, -0.23], [-0.038, -0.275], [0.038, -0.275], [0.038, -0.23], [0.465, -0.23]]'
        linear_min: 0.005
        linear_max: 0.2
        theta_min: -1.0
        theta_max: 1.0
      translation_backward:
        # The padded four-wheel footprint; no extra rear band.
        points: '[[0.07, 0.23], [0.038, 0.23], [0.038, 0.275], [-0.038, 0.275], [-0.038, 0.23], [-0.172, 0.23], [-0.172, 0.275], [-0.248, 0.275], [-0.248, 0.23], [-0.28, 0.23], [-0.28, -0.23], [-0.248, -0.23], [-0.248, -0.275], [-0.172, -0.275], [-0.172, -0.23], [-0.038, -0.23], [-0.038, -0.275], [0.038, -0.275], [0.038, -0.23], [0.07, -0.23]]'
        linear_min: -0.2
        linear_max: -0.005
        theta_min: -1.0
        theta_max: 1.0
      stopped:
        # Last-entry fallback required by Collision Monitor. Sides and rear are the
        # padded footprint: the 5 cm band held the robot still beside the water box
        # with about 10 cm real clearance (2026-10-01).
        points: '[[0.465, 0.23], [0.038, 0.23], [0.038, 0.275], [-0.038, 0.275], [-0.038, 0.23], [-0.172, 0.23], [-0.172, 0.275], [-0.248, 0.275], [-0.248, 0.23], [-0.28, 0.23], [-0.28, -0.23], [-0.248, -0.23], [-0.248, -0.275], [-0.172, -0.275], [-0.172, -0.23], [-0.038, -0.23], [-0.038, -0.275], [0.038, -0.275], [0.038, -0.23], [0.465, -0.23]]'
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -1.0
        theta_max: 1.0
    SlowdownZone:
      type: polygon
      points: '[[0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5]]'
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.8
      visualize: true
      polygon_pub_topic: slowdown_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 0.5
      simulation_time_step: 0.1
      min_points: 3
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      enabled: true
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_footprint
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
