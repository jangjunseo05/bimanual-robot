<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MS AMMR 로봇 관제</title>
  <style>
    :root {
      --bg: #f4f6fa; --panel: #ffffff; --panel-2: #eef1f6; --line: #dbe1ea; --ink: #1a2433; --muted: #566478; --faint: #7d8ba0;
      --accent: #1769c7; --accent-soft: rgba(23,105,199,.1); --ok: #0d8559; --ok-soft: rgba(13,133,89,.12);
      --warn: #a86400; --warn-soft: rgba(168,100,0,.12); --danger: #cf2338; --danger-soft: rgba(207,35,56,.1);
      --mono: "JetBrains Mono", "Cascadia Code", Consolas, "D2Coding", monospace;
      --radius: 10px;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-size: 13px; line-height: 1.4; }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* 화면 전체: 위 고정 줄 + 남는 높이를 모두 쓰는 보드. 페이지는 스크롤하지 않는다. */
    main { display: flex; flex-direction: column; gap: 8px; height: 100vh; height: 100dvh; padding: 0 12px 10px; overflow: hidden; }
    header { flex: none; display: flex; align-items: center; gap: 12px; margin: 0 -12px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .title { flex: none; min-width: 0; max-width: 340px; }
    h1 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink); }
    .sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conn.bad { color: var(--danger); font-weight: 700; }
    .hints { flex: 1; min-width: 0; text-align: right; }
    .run-hint { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { flex: none; display: flex; align-items: center; gap: 8px; }
    .btn { padding: 6px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); font-weight: 600; }
    .btn:hover:not(:disabled) { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    .btn.small { padding: 2px 8px; font-size: 12px; }
    .btn.start, .btn.stop { min-width: 96px; padding: 8px 16px; border: 0; color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
    .btn.start { background: var(--ok); }
    .btn.stop { background: var(--danger); }
    .btn.stop:hover:not(:disabled) { background: #a81829; }
    .row-actions { display: flex; gap: 5px; }

    .banner { flex: none; padding: 6px 10px; border-radius: 8px; border: 1px solid; font-weight: 600; }
    .banner.demo, .banner.warn { border-color: rgba(168,100,0,.4); background: var(--warn-soft); color: var(--warn); }
    .banner.align { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-color: rgba(23,105,199,.45); background: var(--accent-soft); color: var(--accent); }
    .banner.estop { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
    .banner .btn { flex: none; }

    /* 상태 칸: 배터리 3개 + 미션 + 조작 실행기 */
    .kpis { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .kpi { padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
    .kpi span { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
    .kpi strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi small { display: block; color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
    .dot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    .dot.run { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* 지도 칸 폭은 남는 높이에서 나온다. 전체 지도는 이 칸 안에 비율을 유지해 맞춘다. */
    .board { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) min(calc((100vh - 190px) * .81), 42vw); grid-template-rows: minmax(0, 1fr); gap: 8px; }
    .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
    .card { display: flex; flex-direction: column; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; min-height: 0; }
    .card.flat { flex: none; }
    .card-head { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .tag { padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
    .tag.ok { color: var(--ok); border-color: rgba(13,133,89,.4); }
    .tag.run { color: var(--accent); border-color: rgba(23,105,199,.45); }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); }

    /* 미션 단계 */
    .current-head { flex: none; display: flex; flex-wrap: nowrap; gap: 14px; margin-bottom: 9px; font-size: 12.5px; white-space: nowrap; overflow: hidden; }
    .fsm { flex: none; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; }
    .ph { position: relative; padding: 8px 2px 4px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); text-align: center; min-width: 0; }
    .ph b { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ph i { display: block; font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--faint); }
    .ph.done { border-color: rgba(13,133,89,.35); }
    .ph.done b, .ph.done i { color: var(--ok); }
    .ph.now { border-color: var(--accent); background: var(--accent-soft); }
    .ph.now b, .ph.now i { color: var(--accent); }
    .ph .layer { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); padding: 0 5px; border-radius: 4px; font-size: 9px; font-weight: 800; background: var(--bg); }
    .layer.nav { color: #0a6e96; } .layer.manip { color: #6a46c2; }

    /* 대기열은 약 4줄 높이로 고정하고, 넘치면 칸 안에서만 스크롤한다 */
    .queue-wrap { flex: none; height: 156px; }
    .table-wrap { flex: 1; min-height: 0; overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px 5px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { position: sticky; top: 0; background: var(--panel); color: var(--faint); font-size: 11px; font-weight: 700; white-space: nowrap; }
    td { font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    td.mono, td .mono { font-family: var(--mono); font-size: 11.5px; }
    .empty { color: var(--faint); padding: 6px 0; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge.PENDING { background: var(--warn-soft); color: var(--warn); }
    .badge.ACCEPTED { background: var(--ok-soft); color: var(--ok); }
    .badge.REJECTED { background: var(--panel-2); color: var(--muted); }
    .badge.QUEUED { background: var(--accent-soft); color: var(--accent); }
    .badge.RUNNING { background: var(--accent-soft); color: var(--accent); }
    .badge.SUCCEEDED { background: var(--ok-soft); color: var(--ok); }
    .badge.FAILED { background: var(--danger-soft); color: var(--danger); }
    .badge.CANCELED { background: var(--panel-2); color: var(--muted); }

    .staff-wrap { max-height: 76px; }

    /* 기술 정보: 남는 높이를 나눠 쓰고, 넘치면 칸 안에서만 스크롤한다 */
    .tech { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 8px; }
    .tech table { table-layout: fixed; }
    .tech td { padding: 2px 4px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tech td:nth-child(1) { width: 46px; }
    .tech td:nth-child(2) { width: 58%; }
    .log { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 11.5px; }
    .log li { padding: 2px 0; border-bottom: 1px dashed var(--line); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log .t { color: var(--faint); margin-right: 6px; }
    .log .k { color: var(--accent); margin-right: 6px; }
    .log li.fail .k { color: var(--danger); }
    .log li.ok .k { color: var(--ok); }
    .note { flex: none; margin: 4px 0 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; }
    .st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.off { color: var(--faint); }
    .st .dot { width: 6px; height: 6px; box-shadow: none; }

    /* 지도 */
    .map-card { flex: 1; }
    .map-wrap { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .map-wrap canvas { display: block; image-rendering: pixelated; }
    .map-info { flex: none; margin: 4px 0 0; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pose-live { color: var(--ok); font-weight: 700; }
    .pose-est { color: var(--warn); font-weight: 700; }

    /* 낮은 화면에서는 기술 정보 칸이 남도록 대기열을 약 3줄로 줄인다 */
    @media (max-height: 700px) { .queue-wrap { height: 118px; } .staff-wrap { max-height: 52px; } }

    /* 좁은 화면(휴대폰)은 한 화면에 담을 수 없으므로 세로로 쌓고 스크롤을 허용한다 */
    @media (max-width: 900px) {
      body { overflow: auto; }
      main { height: auto; overflow: visible; }
      header { flex-wrap: wrap; }
      .hints { flex-basis: 100%; order: 3; text-align: left; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .board, .tech { grid-template-columns: minmax(0, 1fr); }
      .tech { overflow: visible; }
      .tech .card { height: 240px; }
      .fsm { grid-template-columns: repeat(4, 1fr); row-gap: 10px; }
      .map-wrap { height: 70vw; flex: none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="title">
      <h1>MS AMMR · 로봇 운영 콘솔</h1>
      <div class="sub"><span id="conn" class="conn">연결 중…</span> · <span id="drive-link" class="conn"></span></div>
    </div>
    <div class="hints">
      <span class="run-hint" id="init-hint"></span>
      <span class="run-hint" id="start-hint"></span>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="drive-init" disabled>주행 초기화</button>
      <button type="button" class="btn start" id="start" disabled>START</button>
      <button type="button" class="btn stop" id="stop">STOP</button>
    </div>
  </header>

  <div class="banner estop" id="estop-banner" hidden>
    <span id="estop-text"></span>
    <button type="button" class="btn" id="estop-reset">긴급 정지 해제</button>
  </div>
  <div class="banner demo" id="demo-note" hidden>체험용 데모입니다. 실제 로봇 값이 아닙니다.</div>
  <div class="banner align" id="align-banner" hidden>
    <span id="align-text"></span>
    <button type="button" class="btn primary" id="align-confirm">정렬 완료</button>
  </div>
  <div class="banner warn" id="paused-banner" hidden>서버가 자동 진행 일시정지 상태입니다. 이 화면에는 재개 버튼이 없습니다(런북 6절).</div>

  <div class="kpis">
    <div class="kpi"><span><i class="dot" id="b-left-dot"></i>왼팔 배터리</span><strong id="b-left">-</strong><small id="b-left-sub">-</small></div>
    <div class="kpi"><span><i class="dot" id="b-right-dot"></i>오른팔 배터리</span><strong id="b-right">-</strong><small id="b-right-sub">-</small></div>
    <div class="kpi"><span><i class="dot" id="b-pi-dot"></i>파이 배터리</span><strong id="b-pi">-</strong><small id="b-pi-sub">-</small></div>
    <div class="kpi"><span><i class="dot" id="k-mission-dot"></i>미션</span><strong id="s-mission">-</strong><small id="s-mission-sub">-</small></div>
    <div class="kpi"><span><i class="dot" id="k-manip-dot"></i>조작 실행기</span><strong id="s-manip">-</strong><small id="s-manip-sub">-</small></div>
  </div>

  <div class="board">
    <div class="col">
      <section class="card flat">
        <div class="card-head"><h2>미션 단계</h2>
          <span class="row-actions">
            <span class="row-actions" id="test-tools" hidden>
              <button type="button" class="btn small" id="t-step">한 단계 진행</button>
              <button type="button" class="btn small" id="t-fail">실패 주입</button>
              <button type="button" class="btn small" id="t-reset" hidden>데모 초기화</button>
            </span>
            <span class="tag" id="fsm-tag">대기</span>
          </span>
        </div>
        <div class="current-head" id="current-head"></div>
        <div class="fsm" id="phases"></div>
      </section>

      <section class="card flat">
        <div class="card-head"><h2>대기열 <span class="muted" id="queue-count"></span></h2><span class="tag">수락 → START</span></div>
        <div class="table-wrap queue-wrap"><table>
          <thead><tr><th>주문 번호</th><th>테이블</th><th>메뉴</th><th>상태</th><th></th></tr></thead>
          <tbody id="queue"></tbody>
        </table></div>
      </section>

      <section class="card flat" id="staff-card" hidden>
        <div class="table-wrap staff-wrap"><table>
          <thead><tr><th>주문 번호</th><th>테이블</th><th>직원 서빙 <span id="staff-count"></span></th><th></th></tr></thead>
          <tbody id="staff"></tbody>
        </table></div>
      </section>

      <div class="tech">
        <section class="card">
          <div class="card-head"><h2>ROS 2 토픽</h2><span class="tag" id="topic-tag">-</span></div>
          <div class="table-wrap"><table><tbody id="topics"></tbody></table></div>
          <p class="note" id="topic-note"></p>
        </section>
        <section class="card">
          <div class="card-head"><h2>백엔드 명령 로그</h2><span class="tag" id="cmd-count">0</span></div>
          <ol class="log" id="commands"></ol>
          <p class="note" id="manip-note"></p>
        </section>
        <section class="card">
          <div class="card-head"><h2>이벤트 기록</h2></div>
          <ol class="log" id="events"></ol>
        </section>
      </div>
    </div>

    <div class="col">
      <section class="card map-card">
        <div class="card-head"><h2>지도</h2><span id="map-src"></span></div>
        <div class="map-wrap" id="map-wrap"><canvas id="map" aria-label="교실 지도와 로봇 위치"></canvas></div>
        <p class="map-info" id="map-note"></p>
      </section>
    </div>
  </div>
</main>
<script src="/config.js"></script>
<script src="/api.js"></script>
<script src="/control.js"></script>
</body>
</html>
